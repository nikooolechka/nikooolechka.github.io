<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АС-Фарм · Анализ конкурентов</title>
<style>
  :root{
    --bg:#0f1720; --card:#17212b; --card2:#1d2a36; --line:#2a3a48;
    --txt:#e8eef3; --mut:#9fb0bd; --acc:#2bb3a3; --accd:#1f8d80;
    --red:#ff6b6b; --redbg:#2a1a1e; --amber:#ffc266; --good:#52c77a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}
  header h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:.2px}
  header .sub{color:var(--mut);font-size:14px;margin-bottom:22px}
  header .acc{color:var(--acc)}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
  .head{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
  .head:hover{background:var(--card2)}
  .thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#0b1118;flex:0 0 auto}
  .htxt{flex:1;min-width:0}
  .htxt .nm{font-weight:700;font-size:15px;margin:0 0 3px}
  .htxt .meta{color:var(--mut);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:rgba(43,179,163,.15);color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
  .star{color:#ffc93c;font-weight:700}
  .chev{color:var(--mut);transition:transform .2s;flex:0 0 auto}
  .item.open .chev{transform:rotate(180deg)}
  .body{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
  .item.open .body{display:block}
  .sec{margin:16px 0 0}
  .sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 8px;font-weight:700}
  .sec h3 .em{color:var(--acc)}
  ul{margin:0;padding:0 0 0 2px;list-style:none}
  li{position:relative;padding:5px 0 5px 20px;font-size:14px;color:var(--txt)}
  li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
  .weak li::before{background:var(--red)}
  .weak li{color:#ffd9d9}
  .ideal{background:linear-gradient(180deg,rgba(43,179,163,.08),transparent);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px 14px;margin-top:16px}
  .ideal h3{color:var(--good)}
  .ideal li::before{background:var(--good)}
  .price{font-weight:800}
  .starbar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
  .starbar .lbl{width:28px;color:var(--mut);text-align:right}
  .bar{flex:1;height:9px;background:#0b1118;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accd),var(--acc))}
  .starbar .n{width:38px;color:var(--mut);font-size:12px}
  .cplx{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .cnt{color:var(--red);font-weight:800;font-size:13px;white-space:nowrap}
  a.src{display:inline-block;margin-top:14px;color:var(--acc);text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid var(--line);padding:7px 13px;border-radius:9px}
  a.src:hover{background:var(--card2)}
  .ca{font-size:14px;background:var(--card2);border-radius:10px;padding:10px 12px}
  .empty{color:var(--mut);font-size:14px;padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Анализ конкурентов <span class="acc">АС-Фарм</span></h1>
    <div class="sub">Каждый изученный товар — отдельный блок. Нажми, чтобы раскрыть полную карту: УТП продавца, слабые места из отзывов, склейка и «идеальный продукт».</div>
  </header>
  <div id="list"><div class="empty">Загрузка…</div></div>
</div>
<script>
function stars(obj, total){
  const order=["5","4","3","2","1"];
  const max=Math.max(1,...order.map(k=>obj[k]||0));
  return order.map(k=>{
    const n=obj[k]||0, w=Math.round((n/max)*100);
    return `<div class="starbar"><span class="lbl">${k}★</span><span class="bar"><i style="width:${w}%"></i></span><span class="n">${n}</span></div>`;
  }).join("");
}
function ulList(arr,cls){ return `<ul class="${cls||''}">`+arr.map(x=>`<li>${x}</li>`).join("")+`</ul>`; }
function complaints(arr){
  return `<ul>`+arr.map(c=>`<li><span class="cplx"><span>${c.text}</span><span class="cnt">${c.count} жалоб${c.count%10===1&&c.count%100!==11?'а':''}</span></span></li>`).join("")+`</ul>`;
}
function card(p){
  const price = p.price!=null ? p.price.toLocaleString('ru-RU')+' ₽' : '<span style="color:var(--mut)">цена с витрины — добавляется</span>';
  return `<div class="item">
    <div class="head" onclick="this.parentNode.classList.toggle('open')">
      <img class="thumb" src="${p.photo}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <div class="htxt">
        <p class="nm">${p.name}</p>
        <div class="meta"><span class="pill">${p.platform}</span><span>${p.brand}</span>
          <span class="star">★ ${p.rating}</span><span>${p.reviews_total.toLocaleString('ru-RU')} отзывов</span>
          <span class="price">${price}</span></div>
      </div>
      <span class="chev">▾</span>
    </div>
    <div class="body">
      <div class="sec"><h3>Целевая аудитория</h3><div class="ca">${p.ca}</div></div>
      <div class="sec"><h3>УТП — что <span class="em">заявил продавец</span></h3>${ulList(p.utp)}</div>
      <div class="sec"><h3>Оценки по товару</h3>${stars(p.stars,p.reviews_total)}<div style="color:var(--mut);font-size:12px;margin-top:6px">${p.stars_note}</div></div>
      <div class="sec weak"><h3 style="color:var(--red)">Слабые места — заявлено против реальности отзывов</h3>${ulList(p.weak,'weak')}</div>
      <div class="sec"><h3>Топ-жалобы (с числами)</h3>${complaints(p.complaints)}</div>
      <div class="sec"><h3>Преимущества (кратко)</h3>${ulList(p.advantages)}</div>
      <div class="sec"><h3>Склейка / варианты</h3>${ulList(p.skleyka)}</div>
      <div class="ideal"><h3>🎯 Идеальный продукт для покупателя</h3>${ulList(p.ideal,'ideal')}</div>
      <a class="src" href="${p.url}" target="_blank" rel="noopener">Открыть карточку товара →</a>
    </div>
  </div>`;
}
fetch('analiz_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  const el=document.getElementById('list');
  if(!d.products||!d.products.length){el.innerHTML='<div class="empty">Пока нет изученных товаров.</div>';return;}
  el.innerHTML=d.products.map(card).join("");
  el.firstChild.classList.add('open');
}).catch(e=>{document.getElementById('list').innerHTML='<div class="empty">Ошибка загрузки данных.</div>';});
</script>
</body>
</html>
