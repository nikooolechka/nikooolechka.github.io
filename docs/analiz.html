<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализ карточек товаров · АС-Фарм</title>
<style>
  :root{
    --cyan:#2ee6c8; --cyan2:#19b6ff; --violet:#8b5cf6;
    --txt:#eaf2f7; --mut:#8ea3b4; --red:#ff6b7d; --green:#48e59b; --gold:#ffd23f;
    --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;color:var(--txt);background:#070b11;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;line-height:1.5}
  .bg{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(1200px 700px at 15% -10%,rgba(25,182,255,.14),transparent 60%),
    radial-gradient(1000px 800px at 110% 10%,rgba(139,92,246,.14),transparent 55%),
    radial-gradient(900px 900px at 50% 120%,rgba(46,230,200,.10),transparent 60%),#070b11}
  .orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 18s ease-in-out infinite}
  .orb.a{width:340px;height:340px;background:radial-gradient(circle,#19b6ff,transparent 70%);top:-80px;left:-60px}
  .orb.b{width:300px;height:300px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:30%;right:-80px;animation-delay:-6s}
  .orb.c{width:360px;height:360px;background:radial-gradient(circle,#2ee6c8,transparent 70%);bottom:-120px;left:30%;animation-delay:-11s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
  .wrap{max-width:900px;margin:0 auto;padding:40px 18px 80px}
  .kicker{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--cyan);padding:6px 13px;border:1px solid var(--line);border-radius:999px;
    background:var(--glass);backdrop-filter:blur(10px);margin-bottom:16px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  h1{font-size:37px;line-height:1.08;margin:0 0 10px;font-weight:850;letter-spacing:-.5px;white-space:nowrap;
    background:linear-gradient(110deg,#fff 10%,var(--cyan) 45%,var(--cyan2) 70%,var(--violet));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  header .sub{color:var(--mut);font-size:15px;max-width:640px;margin-bottom:30px}
  .item{position:relative;margin:16px 0;border-radius:20px;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;
    opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;transition:box-shadow .35s,transform .35s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .item::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;pointer-events:none;
    background:linear-gradient(130deg,rgba(46,230,200,.5),rgba(25,182,255,.15) 40%,transparent 60%,rgba(139,92,246,.4));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;transition:opacity .35s}
  .item:hover{transform:translateY(-3px);box-shadow:0 20px 60px -20px rgba(25,182,255,.4)}
  .item:hover::before,.item.open::before{opacity:1}
  .head{display:flex;gap:16px;align-items:center;padding:16px 18px;cursor:pointer;user-select:none;position:relative;z-index:1}
  .thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#0b1118;flex:0 0 auto;box-shadow:0 0 0 1px var(--line),0 8px 24px -8px rgba(0,0,0,.6)}
  .htxt{flex:1;min-width:0}
  .htxt .nm{font-weight:750;font-size:16px;margin:0 0 6px;letter-spacing:-.2px}
  .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
  .pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.6px;color:#04121a;
    background:linear-gradient(100deg,var(--cyan),var(--cyan2));box-shadow:0 0 16px -3px var(--cyan2)}
  .rate{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.5)}
  .price{font-weight:800;color:var(--txt)}
  .price .old{color:var(--mut);font-weight:500;text-decoration:line-through;margin-left:6px;font-size:12px}
  .adate{font-size:11px;color:var(--mut);opacity:.8}
  .open-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;color:#04121a;text-decoration:none;
    font-size:12.5px;font-weight:800;padding:9px 14px;border-radius:11px;white-space:nowrap;
    background:linear-gradient(100deg,var(--cyan),var(--cyan2));box-shadow:0 8px 24px -10px var(--cyan2);transition:transform .2s}
  .open-btn:hover{transform:translateY(-2px)}
  .chev{color:var(--mut);font-size:18px;transition:transform .35s;flex:0 0 auto}
  .item.open .chev{transform:rotate(180deg);color:var(--cyan)}
  .body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.7,.2,1);position:relative;z-index:1}
  .inner{padding:2px 18px 22px}
  .sep{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:2px 0 6px}
  .sec{margin:20px 0 0}
  .sec h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;letter-spacing:.3px;color:var(--txt);margin:0 0 11px;font-weight:800}
  .sec h3 .bar{width:16px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),transparent);flex:0 0 auto}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .tag.claim{color:#ffd98a;background:rgba(255,210,63,.1)}
  .tag.rev{color:var(--cyan);background:rgba(46,230,200,.1)}
  ul{margin:0;padding:0;list-style:none}
  li{position:relative;padding:7px 0 7px 22px;font-size:14.5px}
  li::before{content:"";position:absolute;left:3px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .claimlist li::before{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .ca{font-size:14.5px;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .starbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .starbar .lbl{width:30px;color:var(--gold);text-align:right;font-weight:700}
  .track{flex:1;height:10px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .track i{display:block;height:100%;width:0;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .starbar .n{width:48px;color:var(--mut);font-size:12px}
  .subh{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--mut);text-transform:uppercase;margin:16px 0 6px}
  .procbadge{font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut);opacity:.85;white-space:nowrap}
  .negbadge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#ffd9de;
    background:linear-gradient(100deg,rgba(255,107,125,.16),transparent);border:1px solid rgba(255,107,125,.3);
    border-radius:12px;padding:9px 14px;margin-bottom:6px}
  .negbadge b{color:var(--red);font-size:16px}
  .cplx li::before{background:var(--red);box-shadow:0 0 10px var(--red)}
  .cplx li{color:#ffe0e4}
  .cplx .note{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
  .gap{border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:8px 0;background:var(--glass2)}
  .gap .c{color:#ffd98a;font-size:13px;font-weight:700}
  .gap .c::before{content:"Заявлено: ";color:var(--mut);font-weight:600}
  .gap .r{color:#ffd9de;font-size:14px;margin-top:5px}
  .gap .r::before{content:"По отзывам: ";color:var(--mut);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12.5px;font-weight:600;color:var(--txt);padding:6px 12px;border-radius:999px;
    background:var(--glass2);border:1px solid var(--line)}
  .ideal{border:1px solid rgba(72,229,155,.3);border-radius:18px;padding:8px 16px 16px;margin-top:22px;
    background:linear-gradient(160deg,rgba(72,229,155,.12),rgba(46,230,200,.04) 50%,transparent);box-shadow:0 0 50px -28px var(--green)}
  .ideal h3{color:var(--green)}
  .ideal li::before{background:var(--green);box-shadow:0 0 12px var(--green)}
  .empty{color:var(--mut);text-align:center;padding:50px 0}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:36px;opacity:.7}
  @media(max-width:560px){h1{font-size:25px}.thumb{width:54px;height:54px}.open-btn{padding:8px 11px;font-size:11.5px}}
  @media(max-width:360px){h1{font-size:21px}}
</style>
</head>
<body>
<div class="bg"></div><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="wrap">
  <header>
    <div class="kicker"><span class="dot"></span>АС-Фарм · аналитика</div>
    <h1>Анализ карточек товаров</h1>
    <div class="sub">Каждый товар — отдельный блок. Нажмите, чтобы раскрыть разбор. У каждого вывода помечен источник: <b style="color:var(--gold)">из инфографики продавца</b> или <b style="color:var(--cyan)">из отзывов покупателей</b>.</div>
  </header>
  <div id="list"><div class="empty">Загрузка…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const COL={"5":"#48e59b","4":"#2ee6c8","3":"#ffd23f","2":"#ff9650","1":"#ff6b7d"};
function stars(obj){
  const order=["5","4","3","2","1"], max=Math.max(1,...order.map(k=>obj[k]||0)), tot=order.reduce((a,k)=>a+(obj[k]||0),0);
  return order.map(k=>{
    const n=obj[k]||0, w=Math.round((n/max)*100), pc=tot?Math.round(n/tot*100):0;
    return `<div class="starbar"><span class="lbl">${k}★</span><span class="track"><i data-w="${w}" style="background:${COL[k]};box-shadow:0 0 14px -2px ${COL[k]}"></i></span><span class="n">${n.toLocaleString('ru-RU')}</span></div>`;
  }).join("");
}
const ul=(arr,cls)=>`<ul class="${cls||''}">`+(arr||[]).map(x=>`<li>${x}</li>`).join("")+`</ul>`;
const cplx=arr=>`<ul class="cplx">`+(arr||[]).map(c=>`<li>${c.t}${c.n?`<span class="note">${c.n}</span>`:''}</li>`).join("")+`</ul>`;
const gaps=arr=>(arr||[]).map(g=>`<div class="gap"><div class="c">${g.claim}</div><div class="r">${g.reality}</div></div>`).join("");
const chips=arr=>(arr&&arr.length)?`<div class="chips">`+arr.map(x=>`<span class="chip">${x}</span>`).join("")+`</div>`:'<div style="color:var(--mut);font-size:13px">Других вариантов под этой карточкой не выявлено.</div>';
function card(p,i){
  const price = p.price!=null ? `<span class="price">${p.price.toLocaleString('ru-RU')} ₽${p.price_old?`<span class="old">${p.price_old.toLocaleString('ru-RU')} ₽</span>`:''}</span>` : '';
  return `<div class="item" style="animation-delay:${i*90}ms">
    <div class="head">
      <img class="thumb" src="${p.photo}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <div class="htxt">
        <p class="nm">${p.name}</p>
        <div class="meta"><span class="pill">${p.platform}</span><span class="rate">★ ${p.rating}</span>
          <span>${p.reviews_total.toLocaleString('ru-RU')} отзывов</span>${price}${p.analyzed?`<span class="adate">анализ ${p.analyzed}</span>`:''}${p.requested_by?`<span class="adate">· запросил ${p.requested_by}</span>`:''}</div>
      </div>
      <a class="open-btn" href="${p.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Открыть карточку ↗</a>
      <span class="chev">▾</span>
    </div>
    <div class="body"><div class="inner"><div class="sep"></div>
      <div class="sec"><h3><span class="bar"></span>Кто покупает и зачем</h3><div class="ca">${p.ca}</div></div>
      <div class="sec"><h3><span class="bar"></span>Что обещает продавец <span class="tag claim">из инфографики и описания</span></h3>${ul(p.seller_claims,'claimlist')}</div>
      <div class="sec"><h3><span class="bar"></span>Что говорят покупатели <span class="tag rev">по ${p.reviews_total.toLocaleString('ru-RU')} отзывам</span></h3>
        ${p.stars ? (p.stars_collected && p.stars_collected < p.reviews_total ? `<div class="subh" style="margin-top:4px">Разбивка по ${p.stars_collected} собранным отзывам из ${p.reviews_total.toLocaleString('ru-RU')}</div>` : '') + stars(p.stars) : ''}
        <div style="color:var(--mut);font-size:12px;margin-top:8px">${p.stars_note||''}</div>
        <div class="subh" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
          <span>За что хвалят</span>
          ${p.processed_count?`<span class="procbadge">обработано ${p.processed_count.toLocaleString('ru-RU')}${p.processed_period?' · '+p.processed_period:''}</span>`:''}
        </div>${ul(p.praise)}
      </div>
      <div class="sec"><h3><span class="bar"></span>На что жалуются <span class="tag rev">по отзывам</span></h3>
        ${p.neg_total ? `<div class="negbadge"><b>${p.neg_total.toLocaleString('ru-RU')}</b> отзывов на 1–3★ · это <b>${p.neg_share}</b> от всех ${p.reviews_total.toLocaleString('ru-RU')}</div>` : ''}
        ${cplx(p.complaints)}
      </div>
      <div class="sec"><h3><span class="bar"></span>Слабые места: обещание ↔ реальность</h3>${gaps(p.gaps)}</div>
      <div class="sec"><h3><span class="bar"></span>Другие товары в этой склейке</h3>${chips(p.skleyka)}</div>
      <div class="ideal"><h3><span class="bar"></span>🎯 Каким стоило бы сделать товар</h3>${ul(p.ideal)}</div>
    </div></div>
  </div>`;
}
function toggle(item,ev){
  if(ev&&ev.target.closest('.open-btn'))return;
  const body=item.querySelector('.body'), open=item.classList.toggle('open');
  if(open){ body.style.maxHeight=body.scrollHeight+'px'; item.querySelectorAll('.track i').forEach(i=>i.style.width=i.dataset.w+'%'); }
  else body.style.maxHeight='0';
}
fetch('analiz_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  const el=document.getElementById('list');
  if(!d.products||!d.products.length){el.innerHTML='<div class="empty">Пока нет изученных товаров.</div>';return;}
  el.innerHTML=d.products.map((p,i)=>{try{return card(p,i)}catch(e){console.error('card render failed:',p&&p.id,e);return ''}}).join("");
  el.querySelectorAll('.head').forEach(h=>h.addEventListener('click',e=>toggle(h.parentNode,e)));
  document.getElementById('foot').textContent='Обновлено '+(d.updated||'')+' · товаров в разборе: '+d.products.length;
}).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">Ошибка загрузки данных.</div>';});
</script>
</body>
</html>
