<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализ карточек товаров · АС-Фарм</title>
<style>
  :root{
    --cyan:#2ee6c8; --cyan2:#19b6ff; --violet:#8b5cf6;
    --txt:#eaf2f7; --mut:#8ea3b4; --red:#ff6b7d; --green:#48e59b; --gold:#ffd23f;
    --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;color:var(--txt);background:#070b11;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;line-height:1.5}
  .bg{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(1200px 700px at 15% -10%,rgba(25,182,255,.14),transparent 60%),
    radial-gradient(1000px 800px at 110% 10%,rgba(139,92,246,.14),transparent 55%),
    radial-gradient(900px 900px at 50% 120%,rgba(46,230,200,.10),transparent 60%),#070b11}
  .orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 18s ease-in-out infinite}
  .orb.a{width:340px;height:340px;background:radial-gradient(circle,#19b6ff,transparent 70%);top:-80px;left:-60px}
  .orb.b{width:300px;height:300px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:30%;right:-80px;animation-delay:-6s}
  .orb.c{width:360px;height:360px;background:radial-gradient(circle,#2ee6c8,transparent 70%);bottom:-120px;left:30%;animation-delay:-11s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
  .wrap{max-width:900px;margin:0 auto;padding:40px 18px 80px}
  .kicker{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--cyan);padding:6px 13px;border:1px solid var(--line);border-radius:999px;
    background:var(--glass);backdrop-filter:blur(10px);margin-bottom:16px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  h1{font-size:37px;line-height:1.08;margin:0 0 10px;font-weight:850;letter-spacing:-.5px;white-space:nowrap;
    background:linear-gradient(110deg,#fff 10%,var(--cyan) 45%,var(--cyan2) 70%,var(--violet));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  header .sub{color:var(--mut);font-size:15px;max-width:640px;margin-bottom:30px}
  .item{position:relative;margin:16px 0;border-radius:20px;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;
    opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;transition:box-shadow .35s,transform .35s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .item::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;pointer-events:none;
    background:linear-gradient(130deg,rgba(46,230,200,.5),rgba(25,182,255,.15) 40%,transparent 60%,rgba(139,92,246,.4));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;transition:opacity .35s}
  .item:hover{transform:translateY(-3px);box-shadow:0 20px 60px -20px rgba(25,182,255,.4)}
  .item:hover::before,.item.open::before{opacity:1}
  .head{display:flex;gap:16px;align-items:center;padding:16px 18px;cursor:pointer;user-select:none;position:relative;z-index:1}
  .thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#0b1118;flex:0 0 auto;box-shadow:0 0 0 1px var(--line),0 8px 24px -8px rgba(0,0,0,.6)}
  .htxt{flex:1;min-width:0}
  .htxt .nm{font-weight:750;font-size:16px;margin:0 0 6px;letter-spacing:-.2px}
  .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
  .pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.6px;color:#04121a;
    background:linear-gradient(100deg,var(--cyan),var(--cyan2));box-shadow:0 0 16px -3px var(--cyan2)}
  .rate{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.5)}
  .price{font-weight:800;color:var(--txt)}
  .price .old{color:var(--mut);font-weight:500;text-decoration:line-through;margin-left:6px;font-size:12px}
  .adate{font-size:11px;color:var(--mut);opacity:.8}
  .open-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;color:#04121a;text-decoration:none;
    font-size:12.5px;font-weight:800;padding:9px 14px;border-radius:11px;white-space:nowrap;
    background:linear-gradient(100deg,var(--cyan),var(--cyan2));box-shadow:0 8px 24px -10px var(--cyan2);transition:transform .2s}
  .open-btn:hover{transform:translateY(-2px)}
  .chev{color:var(--mut);font-size:18px;transition:transform .35s;flex:0 0 auto}
  .item.open .chev{transform:rotate(180deg);color:var(--cyan)}
  .body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.7,.2,1);position:relative;z-index:1}
  .inner{padding:2px 18px 22px}
  .sep{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:2px 0 6px}
  .sec{margin:20px 0 0}
  .sec h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;letter-spacing:.3px;color:var(--txt);margin:0 0 11px;font-weight:800}
  .sec h3 .bar{width:16px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),transparent);flex:0 0 auto}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .tag.claim{color:#ffd98a;background:rgba(255,210,63,.1)}
  .tag.rev{color:var(--cyan);background:rgba(46,230,200,.1)}
  ul{margin:0;padding:0;list-style:none}
  li{position:relative;padding:7px 0 7px 22px;font-size:14.5px}
  li::before{content:"";position:absolute;left:3px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .claimlist li::before{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .ca{font-size:14.5px;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .starbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .starbar .lbl{width:30px;color:var(--gold);text-align:right;font-weight:700}
  .track{flex:1;height:10px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .track i{display:block;height:100%;width:0;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .starbar .n{width:48px;color:var(--mut);font-size:12px}
  .subh{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--mut);text-transform:uppercase;margin:16px 0 6px}
  .procbadge{font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mut);opacity:.85;white-space:nowrap}
  .negbadge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#ffd9de;
    background:linear-gradient(100deg,rgba(255,107,125,.16),transparent);border:1px solid rgba(255,107,125,.3);
    border-radius:12px;padding:9px 14px;margin-bottom:6px}
  .negbadge b{color:var(--red);font-size:16px}
  .cplx li::before{background:var(--red);box-shadow:0 0 10px var(--red)}
  .cplx li{color:#ffe0e4}
  .cplx .note{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
  .gap{border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:8px 0;background:var(--glass2)}
  .gap .c{color:#ffd98a;font-size:13px;font-weight:700}
  .gap .c::before{content:"Заявлено: ";color:var(--mut);font-weight:600}
  .gap .r{color:#ffd9de;font-size:14px;margin-top:5px}
  .gap .r::before{content:"По отзывам: ";color:var(--mut);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12.5px;font-weight:600;color:var(--txt);padding:6px 12px;border-radius:999px;
    background:var(--glass2);border:1px solid var(--line)}
  .ideal{border:1px solid rgba(72,229,155,.3);border-radius:18px;padding:8px 16px 16px;margin-top:22px;
    background:linear-gradient(160deg,rgba(72,229,155,.12),rgba(46,230,200,.04) 50%,transparent);box-shadow:0 0 50px -28px var(--green)}
  .ideal h3{color:var(--green)}
  .ideal li::before{background:var(--green);box-shadow:0 0 12px var(--green)}
  .filters{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  .fgroup{display:flex;flex-wrap:wrap;gap:8px}
  .fgroup.mp{flex:0 0 auto;flex-wrap:nowrap}
  .fchip{font-size:12.5px;font-weight:700;color:var(--mut);padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass);cursor:pointer;user-select:none;white-space:nowrap;
    transition:transform .2s,box-shadow .3s,color .3s,background .3s,border-color .3s}
  .fchip:hover{color:var(--txt);border-color:rgba(255,255,255,.22)}
  .fchip .cnt{opacity:.65;font-weight:600;margin-left:5px}
  .fchip.active{color:#04121a;border-color:transparent;background:linear-gradient(100deg,var(--cyan),var(--cyan2));
    box-shadow:0 0 22px -4px var(--cyan2),0 6px 18px -8px rgba(0,0,0,.5);transform:translateY(-1px)}
  .fchip.active .cnt{opacity:.75}
  .fchip.stm.active{background:linear-gradient(100deg,var(--violet),#b794f6);box-shadow:0 0 22px -4px var(--violet)}
  .fchip.mpbtn.active{background:linear-gradient(100deg,var(--green),#2ee6c8);box-shadow:0 0 22px -4px var(--green)}
  .item.hide{display:none}
  /* ---- вложенные аккордеоны внутри карточки ---- */
  .acc{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--glass2);overflow:hidden;transition:border-color .3s}
  .acc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
  .acc-ic{font-size:16px;flex:0 0 auto}
  .acc-t{font-weight:800;font-size:14.5px;color:var(--txt);flex:0 0 auto;letter-spacing:-.2px}
  .acc-meta{flex:1;color:var(--mut);font-size:12px;min-width:0}
  .acc-chev{color:var(--mut);font-size:16px;transition:transform .35s;flex:0 0 auto}
  .acc.open{border-color:rgba(46,230,200,.32)}
  .acc.open .acc-chev{transform:rotate(180deg);color:var(--cyan)}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.7,.2,1)}
  .acc-in{padding:0 16px 14px}
  .mpwrap{padding-top:4px}
  /* ---- MPStats: продажи и рынок ---- */
  .mp{border:1px solid rgba(25,182,255,.28);border-radius:18px;padding:8px 16px 18px;margin-top:22px;
    background:linear-gradient(160deg,rgba(25,182,255,.11),rgba(139,92,246,.05) 55%,transparent)}
  .mp h3{color:var(--cyan2)}
  .mp h3 .src{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--mut);opacity:.8;text-transform:none}
  .mpstats{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 2px}
  .mpstat{flex:1 1 130px;background:var(--glass2);border:1px solid var(--line);border-radius:13px;padding:10px 13px}
  .mpstat .k{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:3px}
  .mpstat .v{font-size:19px;font-weight:850;color:var(--txt);line-height:1.1}
  .mpstat .v small{font-size:12px;color:var(--mut);font-weight:600}
  .mpsub{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--mut);text-transform:uppercase;
    margin:17px 0 9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mpsub .r{color:var(--cyan);font-weight:700;text-transform:none;letter-spacing:0;display:inline-flex;gap:12px;align-items:center}
  .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);font-weight:600}
  .lg::before{content:"";width:9px;height:9px;border-radius:2px;display:inline-block}
  .lg.lgu::before{background:linear-gradient(180deg,var(--green),var(--cyan))}
  .lg.lgr::before{background:linear-gradient(180deg,var(--violet),#b794f6)}
  .chart.daily{height:104px;align-items:flex-end;gap:2px}
  .chart.daily .col .vlabel{font-size:9px;color:var(--txt);font-weight:800;margin-bottom:2px;min-height:11px;opacity:.95}
  .daxis{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);opacity:.75;margin-top:6px;padding:0 2px}
  .mprow{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;margin-top:4px}
  .mprow .mphalf{flex:1 1 300px;min-width:0;border:1px solid var(--line);border-radius:14px;padding:2px 14px 14px;background:var(--glass2)}
  .mprow .mphalf .mpsub{margin-top:12px}
  .mprow .combo{gap:3px;height:118px}
  .mprow .combo .pair i{width:11px}
  .mprow .chart.month{height:118px}
  .combo{display:flex;align-items:flex-end;gap:5px;height:124px}
  .combo .mg{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
  .combo .pair{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%;width:100%}
  .combo .pair i{width:13px;max-width:15px;border-radius:4px 4px 2px 2px;min-height:2px}
  .combo .bu{background:linear-gradient(180deg,var(--green),var(--cyan));box-shadow:0 0 11px -4px var(--green)}
  .combo .br{background:linear-gradient(180deg,var(--violet),#b794f6);box-shadow:0 0 11px -4px var(--violet)}
  .combo .cl{font-size:9.5px;color:var(--mut);font-weight:700;margin-top:6px;text-align:center;line-height:1.3;white-space:nowrap}
  .combo .cl b{display:block;color:var(--txt);font-size:10.5px}
  .combo .cl em{display:block;font-style:normal;color:#b794f6;font-size:9.5px;opacity:.95}
  .chart{display:flex;align-items:flex-end;gap:3px;height:94px}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
  .chart .col i{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;min-height:2px;
    background:linear-gradient(180deg,var(--cyan),var(--cyan2));box-shadow:0 0 12px -4px var(--cyan2)}
  .chart.month .col i{background:linear-gradient(180deg,var(--green),var(--cyan));box-shadow:0 0 12px -4px var(--green)}
  .chart.rev .col i{background:linear-gradient(180deg,var(--violet),#b794f6);box-shadow:0 0 12px -4px var(--violet)}
  .chart .col .cl{font-size:9.5px;color:var(--mut);font-weight:700;margin-top:5px;white-space:nowrap;text-align:center;line-height:1.25}
  .chart .col .cl b{display:block;color:var(--txt);font-size:11px}
  .chart .col .cl em{display:block;font-style:normal;color:var(--mut);font-size:9px;opacity:.85}
  .chart .col .vlabel{font-size:9px;color:var(--txt);font-weight:700;margin-bottom:3px;opacity:.9}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);opacity:.7;margin-top:5px}
  .mpnote{font-size:12.5px;color:var(--mut);margin-top:7px}
  .mpwarn{font-size:11.5px;color:#ffb3bd;background:linear-gradient(100deg,rgba(255,107,125,.16),transparent);
    border:1px solid rgba(255,107,125,.35);border-radius:10px;padding:9px 12px;margin-top:14px;font-weight:600;line-height:1.4}
  .oosbox{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#ffd9de;
    background:linear-gradient(100deg,rgba(255,107,125,.14),transparent);border:1px solid rgba(255,107,125,.28);
    border-radius:12px;padding:9px 14px}
  .kwrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kwrow:last-child{border-bottom:none}
  .kwrow .q{flex:1;color:var(--txt);font-weight:600}
  .kwrow .dem{color:var(--mut);font-size:12px;white-space:nowrap}
  .kwrow .pz{color:var(--cyan);font-weight:800;white-space:nowrap;font-size:13px}
  .postat{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--txt);margin-bottom:9px}
  .postat .up{color:var(--green)}.postat .down{color:var(--red)}
  .nrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;text-decoration:none}
  .nrow:last-child{border-bottom:none}
  .nrow .q{flex:1;color:var(--txt);font-weight:600;min-width:0}
  .nrow .q em{display:block;font-style:normal;color:var(--mut);font-size:11px;font-weight:500;margin-top:2px}
  .nrow .dem{color:var(--mut);font-size:12px;white-space:nowrap}
  .nrow .pz{color:var(--cyan);font-weight:800;white-space:nowrap;font-size:12.5px}
  .nrow:hover .q{color:var(--cyan)}
  .shrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
  .shrow .nm2{flex:0 0 40%;color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shrow .shr{flex:1;height:10px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
  .shrow .shr i{display:block;height:100%;border-radius:6px;box-shadow:0 0 12px -3px var(--cyan2)}
  .shrow .pz{color:var(--txt);font-weight:800;font-size:12.5px;width:40px;text-align:right}
  .empty{color:var(--mut);text-align:center;padding:50px 0}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:36px;opacity:.7}
  @media(max-width:560px){
    h1{font-size:25px}
    /* шапка: картинка слева, название+мета справа от неё; кнопка «Открыть» — слим-строкой снизу без пустот */
    .head{flex-wrap:wrap;row-gap:4px;column-gap:12px;align-items:flex-start;padding:13px 15px 12px}
    .thumb{width:52px;height:52px;order:1}
    .htxt{order:2;flex:1 1 0;min-width:0}
    .chev{order:3;flex:0 0 auto}
    .open-btn{order:4;flex:1 1 100%;justify-content:center;padding:7px 11px;font-size:12px;margin-top:4px}
    .htxt .nm{font-size:15px;line-height:1.3;margin-bottom:4px}
    .htxt .meta{font-size:12px;gap:6px;margin-bottom:0}
  }
  @media(max-width:360px){h1{font-size:21px}}
</style>
</head>
<body>
<div class="bg"></div><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="wrap">
  <header>
    <div class="kicker"><span class="dot"></span>АС-Фарм · аналитика</div>
    <h1>Анализ карточек товаров</h1>
    <div class="sub">Каждый товар — отдельный блок. Нажмите, чтобы раскрыть разбор. У каждого вывода помечен источник: <b style="color:var(--gold)">из инфографики продавца</b> или <b style="color:var(--cyan)">из отзывов покупателей</b>.</div>
  </header>
  <div class="filters" id="filters" style="display:none">
    <div class="fgroup" id="catgroup"></div>
    <div class="fgroup mp" id="mpgroup"></div>
  </div>
  <div id="list"><div class="empty">Загрузка…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const COL={"5":"#48e59b","4":"#2ee6c8","3":"#ffd23f","2":"#ff9650","1":"#ff6b7d"};
function stars(obj){
  const order=["5","4","3","2","1"], max=Math.max(1,...order.map(k=>obj[k]||0)), tot=order.reduce((a,k)=>a+(obj[k]||0),0);
  return order.map(k=>{
    const n=obj[k]||0, w=Math.round((n/max)*100), pc=tot?Math.round(n/tot*100):0;
    return `<div class="starbar"><span class="lbl">${k}★</span><span class="track"><i data-w="${w}" style="background:${COL[k]};box-shadow:0 0 14px -2px ${COL[k]}"></i></span><span class="n">${n.toLocaleString('ru-RU')}</span></div>`;
  }).join("");
}
const ul=(arr,cls)=>`<ul class="${cls||''}">`+(arr||[]).map(x=>`<li>${x}</li>`).join("")+`</ul>`;
const cplx=arr=>`<ul class="cplx">`+(arr||[]).map(c=>`<li>${c.t}${c.n?`<span class="note">${c.n}</span>`:''}</li>`).join("")+`</ul>`;
const gaps=arr=>(arr||[]).map(g=>`<div class="gap"><div class="c">${g.claim}</div><div class="r">${g.reality}</div></div>`).join("");
const chips=arr=>(arr&&arr.length)?`<div class="chips">`+arr.map(x=>`<span class="chip">${x}</span>`).join("")+`</div>`:'<div style="color:var(--mut);font-size:13px">Других вариантов под этой карточкой не выявлено.</div>';
const rub=n=>(n||0).toLocaleString('ru-RU');
const dmy=d=>d.slice(3)+'.'+d.slice(0,2);   // "MM-DD" -> "DD.MM"
const WARN='<div class="mpwarn">⚠️ MPStats может некорректно считывать продажи в шт. и ₽ (особенно по склейкам) — доверять этому источнику на 100% нельзя.</div>';
function barChart(arr,valKey,cls,labelFn,titleFn){
  const max=Math.max(1,...arr.map(x=>x[valKey]||0));
  return `<div class="chart ${cls||''}">`+arr.map(x=>{
    const v=x[valKey]||0, h=Math.round(v/max*100);
    return `<div class="col" title="${titleFn?titleFn(x):''}"><i style="height:${h}%"></i>${labelFn?`<span class="cl">${labelFn(x)}</span>`:''}</div>`;
  }).join("")+`</div>`;
}
// дневной график: число продаж над столбиком; даты — отдельной осью снизу (6 равномерных)
function dailyChart(a){
  const max=Math.max(1,...a.map(x=>x.u||0));
  const bars=`<div class="chart daily">`+a.map(x=>{
    const v=x.u||0, h=Math.round(v/max*100), dd=dmy(x.d);
    return `<div class="col" title="${dd}: ${v} шт · ${rub(x.r)} ₽"><span class="vlabel">${v>0?v:''}</span><i style="height:${h}%"></i></div>`;
  }).join("")+`</div>`;
  const n=a.length, ticks=[0,1,2,3,4,5].map(k=>a[Math.round(k*(n-1)/5)]);
  const axis=`<div class="daxis">`+ticks.map(t=>`<span>${dmy(t.d)}</span>`).join("")+`</div>`;
  return bars+axis;
}
// объединённый график: продажи (шт) и выручка (₽) по месяцам, две независимые шкалы
function comboChart(a){
  const mu=Math.max(1,...a.map(x=>x.u||0)), mr=Math.max(1,...a.map(x=>x.r||0));
  return `<div class="combo">`+a.map(x=>{
    const hu=Math.round((x.u||0)/mu*100), hr=Math.round((x.r||0)/mr*100);
    return `<div class="mg"><div class="pair" title="${x.m}: ${rub(x.u)} шт · ${rub(x.r)} ₽">`+
      `<i class="bu" style="height:${hu}%"></i><i class="br" style="height:${hr}%"></i></div>`+
      `<span class="cl"><b>${rub(x.u)} шт</b><em>${Math.round((x.r||0)/1000)}к ₽</em>${x.m}</span></div>`;
  }).join("")+`</div>`;
}
// --- блок «Анализ ниши» (узкая — прямые конкуренты того же типа товара) ---
function nicheblock(n){
  if(!n) return '';
  let h=`<div class="mpwrap">`+WARN+`<div class="mpstats">`;
  h+=`<div class="mpstat"><div class="k">Прямых конкурентов</div><div class="v">${rub(n.total)}</div></div>`;
  h+=`<div class="mpstat"><div class="k">Выручка ниши / мес</div><div class="v">${rub(n.win_rev)} <small>₽</small></div></div>`;
  if(n.avg_price) h+=`<div class="mpstat"><div class="k">Средняя цена</div><div class="v">${rub(n.avg_price)} <small>₽</small></div></div>`;
  if(n.our_rev!=null) h+=`<div class="mpstat"><div class="k">Этот товар / мес</div><div class="v">${rub(n.our_rev)} <small>₽</small></div></div>`;
  h+=`</div>`;
  h+=`<div class="mpnote">Ниша по типу товара: <b style="color:var(--txt)">${n.name||n.path||''}</b>${n.our_rank?` · этот товар <b style="color:var(--txt)">${n.our_rank}-е из ${n.total}</b> по выручке`:''}</div>`;
  if(n.top5&&n.top5.length){
    h+=`<div class="mpsub"><span>Прямые конкуренты по выручке</span></div>`;
    h+=n.top5.map(c=>`<a class="nrow" href="${c.url}" target="_blank" rel="noopener"><span class="q">${c.name}<em>${c.brand}${c.rating?` · ★${c.rating}`:''}</em></span><span class="dem">${rub(c.price)} ₽</span><span class="pz">${rub(c.rev)} ₽/мес</span></a>`).join("");
  }
  // ценовые сегменты (по цене за упаковку)
  if(n.segments&&n.segments.some(s=>s.n>0)){
    h+=`<div class="mpsub"><span>Ценовые сегменты ниши · доля выручки</span><span class="r">цена за упаковку</span></div>`;
    h+=n.segments.filter(s=>s.n>0).map(s=>`<div class="shrow"><span class="nm2">${s.label} <span style="color:var(--mut);font-weight:500">(${s.n})</span></span>${sharebar(s.rev_pct)}<span class="pz">${s.rev_pct}%</span></div>`).join("");
    h+=`<div class="mpnote" style="font-size:11.5px">⚠️ Комплектации у конкурентов разные (кол-во штук/пачек) — цена за упаковку сравнивается условно, не напрямую.</div>`;
  }
  // свободные подниши рядом
  if(n.free&&n.free.items&&n.free.items.length){
    h+=`<div class="mpsub"><span>Свободные подниши рядом · категория «${n.free.parent}»</span></div>`;
    h+=n.free.items.map(f=>`<div class="nrow"><span class="q">${f.opp?'<span style="color:var(--gold)">★ </span>':''}${f.name}<em>${rub(f.brands)} брендов · рейтинг ${f.rating}</em></span><span class="pz">${rub(f.rev_per)} ₽/товар</span></div>`).join("");
    h+=`<div class="mpnote" style="font-size:11.5px"><span style="color:var(--gold)">★</span> — окно: мало брендов + высокая выручка на товар (меньше конкуренции).</div>`;
  }
  h+=`</div>`; return h;
}
function sharebar(pct,color){return `<span class="shr"><i style="width:${Math.min(100,pct)}%;background:${color||'linear-gradient(90deg,var(--cyan),var(--cyan2))'}"></i></span>`;}
// --- блок «Топ бренды и продавцы» + восходящий тренд ---

function mpblock(m){
  if(!m) return '';
  let h=`<div class="mpwrap">`+WARN;
  // верхние показатели
  h+=`<div class="mpstats">`;
  h+=`<div class="mpstat"><div class="k">Продаж за 30 дней</div><div class="v">${rub(m.sales30_u)} <small>шт</small></div></div>`;
  h+=`<div class="mpstat"><div class="k">Выручка за 30 дней</div><div class="v">${rub(m.sales30_r)} <small>₽</small></div></div>`;
  if(m.balance!=null) h+=`<div class="mpstat"><div class="k">В наличии сегодня</div><div class="v">${rub(m.balance)} <small>шт</small></div></div>`;
  if(m.first_date) h+=`<div class="mpstat"><div class="k">На площадке с</div><div class="v" style="font-size:15px">${m.first_date}</div></div>`;
  if(m.buyout!=null) h+=`<div class="mpstat"><div class="k">% выкупа</div><div class="v">${m.buyout}%</div></div>`;
  h+=`</div>`;
  // продажи по дням
  if(m.daily&&m.daily.length){
    h+=`<div class="mpsub"><span>Продажи по дням, шт · ${m.daily_from}–${m.daily_to}</span><span class="r">итого ${rub(m.sales30_u)} шт</span></div>`;
    h+=dailyChart(m.daily);
  }
  // продажи+выручка (слева) и рост отзывов (справа) — в одну строку
  const hasMonthly=m.monthly&&m.monthly.length, hasRev=m.reviews_growth&&m.reviews_growth.length;
  if(hasMonthly||hasRev){
    h+=`<div class="mprow">`;
    if(hasMonthly){
      h+=`<div class="mphalf"><div class="mpsub"><span>Продажи и выручка · ${m.months_year||''}</span>`+
         `<span class="r"><span class="lg lgu">шт</span><span class="lg lgr">₽</span></span></div>`+
         comboChart(m.monthly)+`</div>`;
    }
    if(hasRev){
      const r=m.reviews_growth, net=(r[r.length-1].c||0)-(r[0].c||0);
      h+=`<div class="mphalf"><div class="mpsub"><span>Рост числа отзывов</span><span class="r">+${rub(net)} за полгода</span></div>`+
         barChart(r,'c','month',x=>`<b>${rub(x.c)}</b><em>${x.m}</em>`,x=>`${x.m}: ${rub(x.c)} отзывов${x.delta!=null?' (+'+x.delta+')':''}`)+`</div>`;
    }
    h+=`</div>`;
  }
  // нет в наличии
  if(m.oos&&m.oos.length){
    h+=`<div class="mpsub"><span>Периоды «нет в наличии» за полгода</span></div>`;
    h+=`<div class="oosbox">📦 ${m.oos.map(x=>'с '+x).join('   ·   ')}</div>`;
  }
  // средняя позиция по категориям товара
  if(m.position&&m.position.points&&m.position.points.length){
    const p=m.position.points, first=p[0].p, last=p[p.length-1].p, better=last<first;
    const mx=Math.max(...p.map(y=>y.p));
    const inv=p.map(x=>({v:Math.max(1,mx-x.p+1)}));
    h+=`<div class="mpsub"><span>Средняя позиция в категориях товара · ${m.position.from}–${m.position.to}</span></div>`;
    h+=`<div class="mpnote">Основная категория: <b style="color:var(--txt)">${m.position.category}</b>${m.position.count?` · товар в ${m.position.count} категориях`:''}</div>`;
    h+=`<div class="postat">${first} → ${last} место <span class="${better?'up':'down'}">${better?'↑ растёт':'↓ падает'}</span></div>`;
    h+=barChart(inv,'v','',null,null);
  }
  // ключи
  if(m.keywords&&m.keywords.length){
    h+=`<div class="mpsub"><span>Топ запросов, по которым находят товар</span></div>`;
    h+=m.keywords.map(k=>`<div class="kwrow"><span class="q">${k.q}</span><span class="dem">${rub(k.total)} запр/мес</span><span class="pz">поз. ~${k.pos}</span></div>`).join("");
  }
  h+=`</div>`;
  return h;
}

function toggle(item,ev){
  if(ev&&ev.target.closest('.open-btn'))return;
  if(ev&&ev.target.closest('.acc'))return;   // клики по вложенным аккордеонам — отдельно
  const body=item.querySelector('.body'), open=item.classList.toggle('open');
  if(open){
    body.style.maxHeight=body.scrollHeight+'px';
    item.querySelectorAll('.track i').forEach(i=>i.style.width=i.dataset.w+'%');
    body.addEventListener('transitionend',function te(){
      if(item.classList.contains('open')) body.style.maxHeight='none';  // чтобы вложенные аккордеоны могли расти
      body.removeEventListener('transitionend',te);
    });
  } else {
    body.style.maxHeight=body.scrollHeight+'px'; body.offsetHeight; body.style.maxHeight='0';
  }
}
function toggleAcc(head,ev){
  if(ev)ev.stopPropagation();
  const acc=head.parentNode, b=acc.querySelector('.acc-body'), open=acc.classList.toggle('open');
  if(open){ b.style.maxHeight=b.scrollHeight+'px'; acc.querySelectorAll('.track i').forEach(i=>i.style.width=i.dataset.w+'%'); }
  else b.style.maxHeight='0';
}
const MP_ORDER=["WB","OZ","YM","DM"], MP_LABEL={WB:"ВБ",OZ:"Озон",YM:"ЯМ",DM:"ДМ"};
let activeCats=new Set(), activeMarkets=new Set();  // пусто = фильтр не применяется (показываем всё)
function applyFilters(){
  document.querySelectorAll('#list .item').forEach(it=>{
    const okCat = activeCats.size===0 ? true : [...activeCats].every(c=>
      c==="__stm__" ? it.dataset.stm==="1" : it.dataset.category===c);
    const okMp = activeMarkets.size===0 ? true : activeMarkets.has(it.dataset.platform);
    it.classList.toggle('hide', !(okCat&&okMp));
  });
  const vis=document.querySelectorAll('#list .item:not(.hide)').length;
  const list=document.getElementById('list');
  let none=list.querySelector('.emptyfilter');
  if(vis===0){
    if(!none){none=document.createElement('div');none.className='empty emptyfilter';none.textContent='Нет товаров под этим набором фильтров.';list.appendChild(none);}
  } else if(none){none.remove();}
}
function renderFilters(products){
  const box=document.getElementById('filters');
  if(!products.length){box.style.display='none';return;}
  box.style.display='flex';
  const catCounts={};
  products.forEach(p=>{const c=p.category;if(c) catCounts[c]=(catCounts[c]||0)+1;});
  const stmCount=products.filter(p=>p.is_stm).length;
  const cats=Object.keys(catCounts).sort((a,b)=>a.localeCompare(b,'ru'));
  const catgroup=document.getElementById('catgroup');
  const chipHtml=(key,label,cnt,extraCls,active)=>`<span class="fchip ${extraCls||''} ${active?'active':''}" data-cat="${key.replace(/"/g,'&quot;')}">${label}<span class="cnt">${cnt}</span></span>`;
  let html=chipHtml("Все","Все",products.length,"",activeCats.size===0);
  if(stmCount>0) html+=chipHtml("__stm__","Наш СТМ",stmCount,"stm",activeCats.has("__stm__"));
  cats.forEach(c=>{html+=chipHtml(c,c,catCounts[c],"",activeCats.has(c));});
  catgroup.innerHTML=html;
  catgroup.querySelectorAll('.fchip').forEach(ch=>ch.addEventListener('click',()=>{
    const key=ch.dataset.cat;
    if(key==="Все"){ activeCats.clear(); }
    else{ activeCats.has(key)?activeCats.delete(key):activeCats.add(key); }
    catgroup.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('active',
      x.dataset.cat==="Все" ? activeCats.size===0 : activeCats.has(x.dataset.cat)));
    applyFilters();
  }));
  const mpCounts={}; products.forEach(p=>{mpCounts[p.platform]=(mpCounts[p.platform]||0)+1;});
  const mpgroup=document.getElementById('mpgroup');
  let mhtml="";
  MP_ORDER.forEach(pl=>{mhtml+=chipHtml(pl,MP_LABEL[pl],mpCounts[pl]||0,"mpbtn",activeMarkets.has(pl));});
  mpgroup.innerHTML=mhtml;
  mpgroup.querySelectorAll('.fchip').forEach(ch=>ch.addEventListener('click',()=>{
    const key=ch.dataset.cat;
    activeMarkets.has(key)?activeMarkets.delete(key):activeMarkets.add(key);
    ch.classList.toggle('active',activeMarkets.has(key));
    applyFilters();
  }));
}
fetch('analiz_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  const el=document.getElementById('list');
  if(!d.products||!d.products.length){el.innerHTML='<div class="empty">Пока нет изученных товаров.</div>';return;}
  el.innerHTML=d.products.map((p,i)=>{try{return card(p,i)}catch(e){console.error('card render failed:',p&&p.id,e);return ''}}).join("");
  el.querySelectorAll('.head').forEach(h=>h.addEventListener('click',e=>toggle(h.parentNode,e)));
  renderFilters(d.products);
  document.getElementById('foot').textContent='Обновлено '+(d.updated||'')+' · товаров в разборе: '+d.products.length;
}).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">Ошибка загрузки данных.</div>';});
</script>
</body>
</html>
