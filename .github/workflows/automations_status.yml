name: Статусы автоматизаций (07:00 и 19:00 МСК)

on:
  schedule:
    - cron: "0 4 * * *"     # 07:00 МСК
    - cron: "0 16 * * *"    # 19:00 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automations_status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить прогоны и обновить статусы
        env:
          STATUS_PAT: ${{ secrets.STATUS_PAT }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          SCRAPFLY_KEY_SOCIAL: ${{ secrets.SCRAPFLY_KEY_SOCIAL }}
          REMOTE_PC_HOST: ${{ secrets.REMOTE_PC_HOST }}
        run: python scripts/gen_automations.py
      - name: Опубликовать обновлённые статусы
        run: |
          git config user.name  "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add docs/automations.json
          if ! git diff --cached --quiet; then
            git commit -m "автообновление статусов автоматизаций [skip ci]"
            git push
          else
            echo "статусы без изменений"
          fi
