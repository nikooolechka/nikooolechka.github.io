name: Sync OK publications

on:
  schedule:
    - cron: "0 7 * * 1"   # понедельник 10:00 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ok_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Sync OK publications to calendar
        env:
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
        run: python scripts/ok_sync.py || echo "ok_sync пропущен (не критично)"

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A || true
          git commit -m "chore: ok sync state update [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"
